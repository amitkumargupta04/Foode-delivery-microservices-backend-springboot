spring:
  application:
    name: restaurant-service
  datasource:
    url: jdbc:mysql://localhost:3306/food_restaurant_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: Amit@123
    driver-class-name: com.mysql.cj.jdbc.Driver

  #  JPA & Hibernate Config
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

