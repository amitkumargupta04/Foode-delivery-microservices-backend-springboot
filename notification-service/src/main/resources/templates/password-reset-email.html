<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset Your Password</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">

<!-- Header Fragment -->
<div th:replace="~{fragments/header :: header}"></div>

<div style="background: white; padding: 20px; border-radius: 8px; max-width: 500px; margin: auto;">
    <h2>Password Reset Request</h2>
    <p style="font-size: 15px; color: #57606f; margin-bottom: 15px;">
        Hello <span th:text="${name}">User</span>,
    </p>
    <p>We received a request to reset your password. Use the OTP below to complete the reset process. This OTP is valid for 10 minutes.</p>

    <div style="text-align: center; margin: 20px 0;">
        <span style="font-size: 24px; font-weight: bold; background: #ffebee; color: #c62828; padding: 10px 20px; border-radius: 5px; letter-spacing: 4px;" th:text="${otp}">123456</span>
    </div>

    <p>If you did not request this, please ignore this email.</p>
</div>

<!-- Footer Fragment -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
