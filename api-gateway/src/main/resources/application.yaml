server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**
          filters:
            - RewritePath=/api/inventory/(?<segment>.*), /${segment}

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - RewritePath=/api/notifications/(?<segment>.*), /${segment}

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**
          filters:
            - RewritePath=/api/payments/(?<segment>.*), /${segment}

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
          filters:
            - RewritePath=/api/orders/(?<segment>.*), /${segment}

        - id: restaurant-service
          uri: lb://restaurant-service
          predicates:
            - Path=/api/restaurants/**
          filters:
            - RewritePath=/api/restaurants/(?<segment>.*), /${segment}

        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/api/accounts/**
          filters:
            - RewritePath=/api/accounts/(?<segment>.*), /$\{segment}

        - id: admin-service
          uri: lb://admin-service
          predicates:
            - Path=/api/admin/**
          filters:
            - RewritePath=/api/admin/(?<segment>.*), /${segment}

# Swagger UI Aggregation Configuration
# API Gateway application.yml

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      # Isko update karein (/v3/api-docs/swagger-config ya direct path)
      - name: Account Service
        url: /api/accounts/v3/api-docs
      - name: Admin Service
        url: /api/admin/v3/api-docs
      - name: Restaurant Service
        url: /api/restaurants/v3/api-docs
      - name: Order Service
        url: /api/orders/v3/api-docs
      - name: Payment Service
        url: /api/payments/v3/api-docs
      - name: Notification Service
        url: /api/notifications/v3/api-docs
      - name: Inventory Service
        url: /api/inventory/v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/